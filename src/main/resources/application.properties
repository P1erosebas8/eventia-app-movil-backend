spring.application.name=eventia-app-movil-backend

# Servidor (Render asigna automáticamente la variable PORT)
server.port=${PORT:8080}

# Base de Datos MySQL (soporta variables de entorno de Render / Railway / Aiven / Clever Cloud o fallback local XAMPP)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/eventia_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración JWT (token secreto configurable en Render)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Gmail API REST (HTTPS puerto 443 estándar, 100% compatible con Render)
eventia.mail.gmail-api-token=${EVENTIA_MAIL_GMAIL_API_TOKEN:}
eventia.mail.from=${EVENTIA_MAIL_FROM:no-reply@eventia.com}

# Logging
logging.level.com.eventia_app_movil_backend=INFO
