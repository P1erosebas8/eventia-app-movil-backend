spring.application.name=eventia-app-movil-backend

# Servidor (Render asigna automáticamente la variable PORT)
server.port=${PORT:8080}

# Base de Datos MySQL (Aiven / Clever Cloud / Railway / Render o fallback local XAMPP)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/eventia_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración JWT (se define mediante variable de entorno JWT_SECRET en Render)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Gmail API REST (HTTPS puerto 443 estándar, 100% compatible con Render)
# Credenciales OAuth 2.0 estándar (acepta GOOGLE_* y EVENTIA_MAIL_*)
eventia.mail.client-id=${GOOGLE_CLIENT_ID:${EVENTIA_MAIL_CLIENT_ID:}}
eventia.mail.client-secret=${GOOGLE_CLIENT_SECRET:${EVENTIA_MAIL_CLIENT_SECRET:}}
eventia.mail.refresh-token=${GOOGLE_REFRESH_TOKEN:${EVENTIA_MAIL_REFRESH_TOKEN:}}
eventia.mail.gmail-api-token=${GOOGLE_ACCESS_TOKEN:${EVENTIA_MAIL_GMAIL_API_TOKEN:}}
eventia.mail.from=${EVENTIA_MAIL_FROM:}

# Cloudinary (Almacenamiento de imágenes de eventos y perfiles)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Logging
logging.level.com.eventia_app_movil_backend=INFO
